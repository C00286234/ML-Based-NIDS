# Full stack: API + dashboard + Prometheus + Grafana, plus an optional demo replayer.
#
#   nids model download          # or: nids train
#   docker compose up -d
#   docker compose --profile demo up -d demo   # replay held-out flows so the dashboard fills up
#
# API http://localhost:8000/docs | Dashboard http://localhost:5001
# Prometheus http://localhost:9090 | Grafana http://localhost:3000 (admin / nids-admin)

x-nids: &nids
  build: { context: ., dockerfile: docker/Dockerfile }
  image: nids:latest
  restart: unless-stopped
  networks: [nids]

services:
  api:
    <<: *nids
    container_name: nids-api
    ports: ["8000:8000"]
    environment:
      ENABLE_METRICS: "true"
      NIDS_API_KEY: ${NIDS_API_KEY:-}
      NIDS_REQUIRE_AUTH: ${NIDS_REQUIRE_AUTH:-false}
      NIDS_RATE_LIMIT_ENABLED: ${NIDS_RATE_LIMIT_ENABLED:-false}
    volumes:
      - ./models:/app/models:ro
      - ./reports:/app/reports:ro

  dashboard:
    <<: *nids
    container_name: nids-dashboard
    command: ["gunicorn", "--bind", "0.0.0.0:5001", "--worker-class", "gthread",
              "--threads", "8", "--timeout", "0", "nids.dashboard.app:app"]
    ports: ["5001:5001"]
    environment:
      NIDS_API_URL: http://api:8000
      NIDS_API_KEY: ${NIDS_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
    depends_on:
      api: { condition: service_healthy }

  demo:
    <<: *nids
    container_name: nids-demo
    profiles: [demo]
    restart: "no"
    command: ["nids", "demo", "--api", "http://api:8000", "--rate", "3"]
    healthcheck: { disable: true }
    depends_on:
      api: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: nids-prometheus
    restart: unless-stopped
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [nids]
    depends_on: [api]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: nids-grafana
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-nids-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/nids-dashboard.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [nids]
    depends_on: [prometheus]

networks:
  nids: { name: nids }

volumes:
  prometheus-data:
  grafana-data:
