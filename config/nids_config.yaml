network:
  interface: null       # null = default interface; or a name from `nids engine --list-interfaces`
  promiscuous: true
  bpf_filter: ip
flow:
  # How packets are grouped into flows. The first value matches the training
  # data and should not be changed. See reports/PARITY.md for what the other
  # two cost in accuracy.
  timeout: 120.0        # a flow is cut 120 s after it started
  idle_timeout: 15.0    # live only: score a flow after this many seconds of silence
  close_grace: 1.0      # live only: score a closed TCP connection after this long
  max_flows: 200000
api:
  url: http://localhost:8000
  timeout: 10.0
  retry_count: 3
  workers: 8            # parallel requests to the API
  max_backlog: 5000     # flows waiting for the API before new ones are skipped
alerts:
  confidence_threshold: 0.8   # attack predictions below this are logged but not alerted
alerting:
  email:
    enabled: false
    smtp_server: smtp.gmail.com
    smtp_port: 587
    use_tls: true
    sender: nids-alerts@example.com
    password: ${NIDS_EMAIL_PASSWORD}
    recipients:
    - security-team@example.com
    min_confidence: 0.9
    cooldown_minutes: 5
    severity_threshold: medium
  slack:
    enabled: false
    webhook_url: ${NIDS_SLACK_WEBHOOK}
    channel: "#nids-alerts"
    min_confidence: 0.8
    cooldown_minutes: 2
    severity_threshold: medium
performance:
  packet_batch_size: 500
  stats_interval: 10
heuristics:
  syn_flood_window: 10        # seconds to count SYN micro-flows
  syn_flood_threshold: 20     # RST-terminated SYN flows in window to trigger alert
  port_scan_window: 30        # seconds to count port contacts
  port_scan_threshold: 15     # distinct dst ports in window to trigger alert
