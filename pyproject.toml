[project]
name = "nids"
version = "2.0.0"
description = "Real-time, explainable network intrusion detection with machine learning (CIC-IDS2017)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Folosiye Adegbola" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "imbalanced-learn>=0.12",
    "joblib>=1.3",
    "shap>=0.45",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "slowapi>=0.1.9",
    "prometheus-fastapi-instrumentator>=7.0",
    "prometheus-client>=0.20",
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
capture = ["scapy>=2.5"]
dashboard = ["flask>=3.0", "gunicorn>=22"]
viz = ["matplotlib>=3.8", "seaborn>=0.13"]

[project.scripts]
nids = "nids.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nids"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["docs/fyp"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
